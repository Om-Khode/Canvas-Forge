<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>CanvasForge - Infinite canvas design editor</title>
    <meta
      name="description"
      content="A fast, browser-based infinite canvas for sketching visual ideas. Shapes, text, images, layers, and export - all local-first, nothing leaves your machine."
    />
    <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />

    <!-- SVG first for anything modern; the ICO fallback is not shipped, so the
         link is deliberately absent rather than pointing at a 404. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="canonical" href="https://canvasforge-studio.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CanvasForge" />
    <meta property="og:url" content="https://canvasforge-studio.vercel.app/" />
    <meta property="og:title" content="CanvasForge - Infinite canvas design editor" />
    <meta
      property="og:description"
      content="A fast, browser-based infinite canvas for sketching visual ideas. Local-first, export anywhere."
    />
    <!--
      Absolute, not root-relative: the Open Graph spec requires a full URL, and
      LinkedIn, Slack and WhatsApp all silently drop the image without one - so
      a shared link renders as bare text. The dimensions let a crawler lay the
      card out before it has finished fetching the file.
    -->
    <meta property="og:image" content="https://canvasforge-studio.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The CanvasForge editor: canvas, layers panel and properties panel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://canvasforge-studio.vercel.app/og-image.png" />

    <!--
      Names the site for crawlers. Without it a *.vercel.app subdomain tends to
      be labelled with the host's name in search results, because the shared
      apex is all a crawler has to go on.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CanvasForge",
        "alternateName": "CanvasForge Studio",
        "url": "https://canvasforge-studio.vercel.app/"
      }
    </script>

    <!--
      Applied before first paint so a dark-mode user never sees a white flash.
      Kept inline and tiny on purpose: any module-loaded alternative runs too late.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('canvasforge:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
